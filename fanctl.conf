# /usr/local/etc/fanctl.conf
#
# Saving this file is enough: the daemon notices and reloads within 30 seconds.
# To apply immediately:
#   sudo launchctl kill -HUP system/com.local.fanctl
# Check what it is doing:  fanctl status
# Check the sensors:       fanctl temps

# --------------------------------------------------------------- fan curve
# "temperature:RPM" pairs, in ascending order of temperature. On the way up the
# controller reacts as soon as a threshold is crossed; on the way down it waits
# until the temperature has fallen a further `hysteresis` degrees.
# The first entry's temperature is always treated as 0, so it is the base RPM.
#
# Perceived loudness on an M4 mini:
#   1000 silent / 1400-1800 barely audible / 2300-2900 audible
#   3600 obvious / 4300-4900 loud
curve = 0:1000, 58:1400, 65:1800, 71:2300, 77:2900, 83:3600, 89:4300, 95:4900

# Extra degrees of cooling required before stepping down (C). Stops the fan
# oscillating around a threshold.
hysteresis = 5

# Seconds a step-down must stay justified before it is applied. Keeps the fan
# from dropping the instant a short load ends. The clock starts when the
# step-down first becomes justified, and does not restart if the target keeps
# falling further (3 -> 2 -> 1) while we wait.
down_delay = 30

# Seconds a step-up must stay justified. This is what stops a single momentary
# burst from moving the fan at all.
#
# At 0, brief spikes pass straight through. The curve is a step function and on
# the way up it skips intermediate steps, so one burst can jump 1400 -> 3600.
# Eight seconds is about three polls; the thermal mass a fan can actually affect
# moves on a timescale of tens of seconds, so this delay costs nothing in
# temperature.
up_delay = 8

# ------------------------------------------------------------- slew limiting
# How fast the commanded RPM itself may change (RPM per second).
#
# The ear is far more sensitive to the rate of change than to absolute RPM.
# Writing 1400 -> 3600 to F0Tg in one go makes the fan accelerate as hard as it
# can, and that is what gets noticed. Spread over 200 RPM/s the same change
# becomes an 11-second swell that mostly goes unremarked.
#
# 0 = no limit (the old behaviour). Crossing critical_temp ignores this.
slew_up = 200
slew_down = 120

# ----------------------------------------------------------------- control
# floor : raise F0Mn (minimum RPM) only and leave the decision to the macOS
#         SMC. If more cooling is needed than we asked for, the SMC adds it
#         on its own, which makes this the safer mode.
# force : F0Md=1 plus F0Tg, pinned exactly (the same mechanism Macs Fan Control
#         uses). Use this when floor does not work on your model; run
#         `fanctl selftest` to find out which applies.
# auto  : try writing F0Mn at startup and pick floor if it takes, force if not.
mode = auto

# Hardware limits. max_rpm is automatically clamped down to the F0Mx value.
min_rpm = 1000
max_rpm = 4900

# At or above this temperature, ignore the curve and the slew limits and go
# straight to maximum. Safety net.
critical_temp = 98

# ---------------------------------------------------------------- sampling
# Seconds between samples. Three is plenty; raising it lowers overhead further.
# While ramping the fan, writes happen every 0.5s regardless, because a rate
# limit applied only every 3 seconds still lands as 600 RPM stairs.
poll_interval = 3

# Exponential moving average weights. 1.0 = no smoothing; smaller is less
# sensitive.
#
# Apple Silicon core-die sensors spike more than 20C for a few hundred
# milliseconds on any momentary burst. Measured at idle on this machine: raw
# maximum std dev 8.7C, range 25C. What a fan can actually change is the bulk
# die and heatsink temperature, and that moves over tens of seconds -- so
# decisions come from the smoothed value, not the raw one.
#
# The weights are defined per poll_interval and rescaled by elapsed time, so the
# faster tick used while ramping does not change the time constant. At a 3s poll
# these give roughly a 15s rise and a 37s fall.
#
# Measured here: idle spikes push the control value to 58C, which at alpha 0.20
# lifts the average only to about 53C -- clear of the first threshold at 58C.
alpha_up = 0.20
alpha_down = 0.08

# ----------------------------------------------------------------- sensors
# auto = at startup, scan Tp** (CPU cores) and Tg** (GPU) and monitor only the
#        hottest in each family. `fanctl temps` shows what was selected.
# To choose manually, list keys separated by commas:
#        sensors = Tp0f, Tg0e, Tm1p
sensors = auto

# How to reduce several sensors to the one value fed to the curve.
# mean = average within each family (Tp**, Tg**, ...) and take the maximum
#        across families. The within-family average tracks the bulk temperature
#        of that region of the die; the across-family maximum lets whichever
#        region is actually hot drive the fan. Default.
# max  = just the single hottest sensor. Reacts faster but is far noisier.
#
# critical_temp is always judged on the raw maximum, never the smoothed or
# averaged value.
aggregate = mean
